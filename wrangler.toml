name = "yoqart"
compatibility_date = "2026-09-23"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "yoqart-db"
database_id = "8507024c-d295-4699-a30a-971e23437dd5"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "yoqart-files"

[vars]
AUTH_BASE_URL = "https://yoqart.in"
AUTH_FROM_EMAIL = "YoqArt <noreply@yoqart.in>"

# Preview data is isolated from production accounts and documents.
[env.preview.vars]
AUTH_FROM_EMAIL = "YoqArt <noreply@yoqart.in>"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "yoqart-audit-preview"
database_id = "b2069275-4e28-4581-9fd4-344f322871e5"
